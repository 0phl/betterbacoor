name: Report a website bug
description: Tell us about a broken link, display problem, or feature that does not work.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: |
        This is a public report about BetterBacoor, not a government service request. Remove private details from screenshots and examples. Report sensitive security vulnerabilities through the private channel in SECURITY.md.
  - type: input
    id: page
    attributes:
      label: Affected page
      description: Share the URL or page name. Remove private information from the URL.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Include steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and language
      placeholder: Chrome on Android, Filipino
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no private resident information, credentials, or sensitive vulnerability details.
          required: true
