name: Report incorrect or outdated information
description: Suggest a source-backed correction to a BetterBacoor civic record.
title: 'Correction: '
labels:
  - correction
body:
  - type: markdown
    attributes:
      value: |
        Do not include private IDs, account details, application numbers, health records, passwords, or payment information.

  - type: input
    id: record
    attributes:
      label: Affected page or record
      placeholder: Paste the BetterBacoor URL or record title.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What appears incorrect or outdated?
      description: Explain the specific statement, link, or date that needs review.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Supporting government source
      description: Paste the strongest government URL supporting the correction.
      placeholder: https://bacoor.gov.ph/...
    validations:
      required: true

  - type: input
    id: checked
    attributes:
      label: Date you checked the source
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include private resident information or credentials.
          required: true
