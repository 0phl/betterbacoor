<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | BetterBacoor</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }
      section {
        width: min(42rem, 100%);
        padding: 2rem;
        border: 1px solid #cbd5e1;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 8px 30px rgb(15 23 42 / 0.08);
      }
      .notice {
        color: #1d4ed8;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.75rem 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.05;
      }
      p {
        color: #475569;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        margin-top: 0.75rem;
        padding: 0.65rem 1rem;
        border-radius: 0.6rem;
        color: #ffffff;
        background: #1d4ed8;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <p class="notice">Unofficial and community-run</p>
        <h1 id="page-title">Page not found</h1>
        <p>
          That address is not part of BetterBacoor. Return to the homepage to
          find checked links to Bacoor services, directories, and public
          records.
        </p>
        <a href="/">Return to BetterBacoor</a>
      </section>
    </main>
  </body>
</html>
