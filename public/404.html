<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#071a36" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <title>Page not found | BetterBacoor</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }
      section {
        width: min(42rem, 100%);
        text-align: center;
      }
      .mark {
        display: block;
        width: 6rem;
        height: 6rem;
        margin: 0 auto;
        object-fit: contain;
      }
      .notice {
        margin: 1.5rem 0 0;
        color: #0038a8;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: -0.045em;
      }
      p:not(.notice) {
        max-width: 34rem;
        margin: 1.25rem auto 0;
        color: #475569;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        color: #ffffff;
        background: #0038a8;
        font-weight: 900;
        text-decoration: none;
      }
      a:hover {
        background: #002a80;
      }
      a:focus-visible {
        outline: 3px solid #fcd116;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <img
          class="mark"
          src="/logo-mark.svg"
          alt=""
          aria-hidden="true"
          width="512"
          height="479"
        />
        <p class="notice">Error 404 · Wrong turn</p>
        <h1 id="page-title">This route is not in the guide.</h1>
        <p>
          That address is not part of BetterBacoor. Return to the homepage to
          find checked links to Bacoor services, directories, and public
          records.
        </p>
        <a href="/">Return to BetterBacoor</a>
      </section>
    </main>
  </body>
</html>
